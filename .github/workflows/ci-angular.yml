name: Angular Package CI/CD

on:
  push:
    branches: [main, master, "claude/**"]
    paths:
      - "packages/angular/**"
      - "packages/core/**"
      - ".github/workflows/ci-angular.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "packages/angular/**"
      - "packages/core/**"
      - ".github/workflows/ci-angular.yml"
  release:
    types: [published]

jobs:
  ci:
    name: Test & Build
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'release' ||
      startsWith(github.event.release.tag_name, 'angular@v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (monorepo root)
        run: npm ci

      - name: Run tests (Jest)
        run: npm test
        working-directory: packages/angular

      - name: Build (ng-packagr)
        run: npm run build
        working-directory: packages/angular

      - name: Verify dist output
        run: |
          echo "=== dist/ contents ==="
          ls -lh dist/
          echo "=== ESM2022 entry (first 5 lines) ==="
          head -5 dist/esm2022/allansli-ng-barcode-febraban.mjs
          echo "=== FESM2022 entry exists ==="
          test -f dist/fesm2022/allansli-ng-barcode-febraban.mjs
          echo "=== Type declarations (first 10 lines) ==="
          head -10 dist/index.d.ts
        working-directory: packages/angular

  publish:
    name: Publish to npm
    needs: ci
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'release' &&
      github.event.action == 'published' &&
      startsWith(github.event.release.tag_name, 'angular@v')

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies (monorepo root)
        run: npm ci

      - name: Build (ng-packagr)
        run: npm run build
        working-directory: packages/angular

      - name: Publish @allansli/ng-barcode-febraban
        run: npm publish dist/ --access public --provenance
        working-directory: packages/angular
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
