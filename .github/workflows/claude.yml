name: Claude Code

# Invoke Claude by mentioning @claude in:
#   - A PR or issue comment
#   - A PR review comment
#   - A PR review submission
#   - An issue body or title (when the issue is opened or assigned)
#
# Examples:
#   @claude why is the barcode rendering wrong for odd-length sequences?
#   @claude please refactor the core generateBarcodeSequence function
#   @claude add a test for empty input in the React package
#   @claude explain what this AngularJS directive is doing

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment'              && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review'         && contains(github.event.review.body,  '@claude')) ||
      (github.event_name == 'issues'                      && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read   # lets Claude read CI results on PRs

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Grant Claude read access to Actions logs so it can diagnose
          # failing CI runs when asked (e.g. "@claude why is ci-react failing?")
          additional_permissions: |
            actions: read
