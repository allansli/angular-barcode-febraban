name: React Package CI/CD

on:
  push:
    branches: [main, master, "claude/**"]
    paths:
      - "packages/react/**"
      - ".github/workflows/ci-react.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "packages/react/**"
  release:
    types: [published]

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # CI — test (Jest) then build (Rollup) to verify the bundle is valid
  # Skip entirely when an unrelated release fires (e.g. core@v*)
  # ─────────────────────────────────────────────────────────────────────────────
  ci:
    name: Test & Build
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'release' ||
      startsWith(github.event.release.tag_name, 'react@v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (monorepo root)
        run: npm ci

      - name: Run tests (Jest)
        run: npm test
        working-directory: packages/react

      - name: Build (Rollup)
        run: npm run build
        working-directory: packages/react

      - name: Verify dist output
        run: |
          echo "=== dist/ contents ==="
          ls -lh dist/
          echo "=== ESM entry (first 5 lines) ==="
          head -5 dist/index.esm.js
        working-directory: packages/react

  # ─────────────────────────────────────────────────────────────────────────────
  # Publish — runs only when a GitHub Release is published with a react@v* tag
  #
  # How to publish:
  #   1. Bump "version" in packages/react/package.json and push to main.
  #   2. On GitHub, create a Release with tag  react@v<version>
  #      (e.g.  react@v1.0.1).  Click "Publish release".
  #   3. This job rebuilds the Rollup bundles and publishes
  #      @allansli/react-barcode-febraban to npm.
  #
  # Required repository secret: NPM_TOKEN
  # ─────────────────────────────────────────────────────────────────────────────
  publish:
    name: Publish to npm
    needs: ci
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'release' &&
      github.event.action == 'published' &&
      startsWith(github.event.release.tag_name, 'react@v')

    permissions:
      contents: read
      id-token: write   # for npm provenance

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies (monorepo root)
        run: npm ci

      - name: Build (Rollup)
        # Produces dist/index.esm.js (ESM) and src/index.js (CJS, minified)
        run: npm run build
        working-directory: packages/react

      - name: Publish @allansli/react-barcode-febraban
        run: npm publish --access public --provenance
        working-directory: packages/react
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
