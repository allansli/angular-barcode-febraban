name: React Package CI/CD

on:
  push:
    branches: [main, master, "claude/**"]
    paths:
      - "packages/react/**"
      - "packages/core/**"
      - ".github/workflows/ci-react.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "packages/react/**"
      - "packages/core/**"
      - ".github/workflows/ci-react.yml"
  release:
    types: [published]

jobs:
  ci:
    name: Test & Build
    runs-on: ubuntu-latest
    if: >
      github.event_name != 'release' ||
      startsWith(github.event.release.tag_name, 'react@v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (monorepo root)
        run: npm ci

      - name: Run tests (Jest)
        run: npm test
        working-directory: packages/react

      - name: Build (Rollup)
        run: npm run build
        working-directory: packages/react

      - name: Verify dist output
        run: |
          echo "=== dist/ contents ==="
          ls -lh dist/
          test -f dist/index.esm.js
          test -f dist/index.cjs.js
          echo "=== ESM entry (first 5 lines) ==="
          head -5 dist/index.esm.js
          echo "=== CJS entry (first 5 lines) ==="
          head -5 dist/index.cjs.js
        working-directory: packages/react

  publish:
    name: Publish to npm
    needs: ci
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'release' &&
      github.event.action == 'published' &&
      startsWith(github.event.release.tag_name, 'react@v')

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies (monorepo root)
        run: npm ci

      - name: Build (Rollup)
        run: npm run build
        working-directory: packages/react

      - name: Publish @allansli/react-barcode-febraban
        run: npm publish --access public --provenance
        working-directory: packages/react
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
