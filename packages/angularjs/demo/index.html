<!DOCTYPE html>
<html>
<head>
    <title>AngularJS demo — angular-barcode-febraban</title>
    <link rel="stylesheet" href="../../core/assets/css/barcode.css">
</head>
<body ng-app="barcode-demo">
    <div ng-controller="BarcodeDemoController as bCtrl">
        <span>Input Barcode Sequence: </span><input type="text" ng-model="bCtrl.sequence" />
        <hr>
        <ng-barcode-febraban barcode-sequence="{{bCtrl.sequence}}"></ng-barcode-febraban>
    </div>

    <!-- Pinned CDN for the package demo; not vendored into git. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/angular.js/1.8.2/angular.min.js"></script>
    <script src="../../core/src/generate-barcode-sequence.js"></script>
    <script src="../src/angular-barcode-febraban.module.js"></script>
    <script src="../src/angular-barcode-febraban.utils.js"></script>
    <script src="../src/angular-barcode-febraban.directive.js"></script>
    <script src="index.js"></script>
    <script src="indexController.js"></script>
</body>
</html>
